name: Matchday Settlement Automated Scheduler

on:
  schedule:
    # Daily quota-reset detector & multi-league auto-unlock check at 08:00 UTC
    - cron: '0 8 * * *'
    # Matchday settlement & prediction runs: Saturday, Sunday, Monday at 14:00, 17:00, 19:00, 22:00 UTC
    - cron: '0 14,17,19,22 * * 0,1,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run execution (true/false)'
        required: false
        default: 'false'

concurrency:
  group: settlement-scheduler
  cancel-in-progress: false

jobs:
  settle:
    name: Settle Finished Fixtures & Run Multi-League Auto-Unlock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Settlement Runner
        env:
          NODE_ENV: production
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/run_settle.js --dry-run
          else
            node scripts/run_settle.js
          fi

      - name: Run Quota-Reset Detector & Multi-League Auto-Activator
        env:
          NODE_ENV: production
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          node -e '
            const fs = require("fs");
            const ts = require("typescript");
            require.extensions[".ts"] = (m, f) => {
              const out = ts.transpileModule(fs.readFileSync(f, "utf8"), {
                compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022, esModuleInterop: true, resolveJsonModule: true }
              });
              m._compile(out.outputText, f);
            };
            const { MultiLeagueAutoActivator } = require("./src/engine/activation/multiLeagueAutoActivator.ts");
            const persist = process.env.DRY_RUN !== "true";
            MultiLeagueAutoActivator.runAutoUnlockCycle({
              mode: "LIVE",
              forceAccountSync: true,
              persistToDatabase: persist,
              writeVerificationArtifact: true
            }).then(res => {
              console.log(JSON.stringify({
                quotaState: res.quotaDetection.state,
                requestCount: res.quotaDetection.requestCount,
                requestLimit: res.quotaDetection.requestLimit,
                billableRequestsMade: res.billableRequestsMade,
                leaguesPromoted: res.leaguesPromoted,
                activeLeaguesAfterRun: res.activeLeaguesAfterRun
              }, null, 2));
            }).catch(err => {
              console.error("[FATAL] Auto-unlock cycle failed:", err);
              process.exit(1);
            });
          '

      - name: Trigger Remote Vercel Settlement Endpoint (Idempotent Webhook)
        if: env.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://salmo.dev/api/cron/settle

      - name: Trigger Remote Vercel Auto-Unlock & Prediction Endpoint (Quota-Reset Detector)
        if: env.CRON_SECRET != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://salmo.dev/api/cron/predict
