name: Manual Dry-Run Settlement & Readiness Proposal Audit

# H3 Scheduler Safety:
# vercel.json is the single authoritative scheduler for /api/cron/predict and /api/cron/settle.
# This GitHub workflow is strictly manual (workflow_dispatch) and non-mutating (dry-run / PROPOSE_ONLY).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run execution (strictly enforced true in CI)'
        required: false
        default: 'true'

concurrency:
  group: settlement-manual-audit
  cancel-in-progress: false

jobs:
  settle:
    name: Dry-Run Settlement & Read-Only Readiness Proposal Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Settlement Runner (Dry-Run Only)
        env:
          NODE_ENV: production
          CI: 'true'
          ALLOW_PRODUCTION_DB_WRITE: 'false'
          ENABLE_THESPORTSDB: 'false'
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/run_settle.js --dry-run

      - name: Run Quota-Reset Detector & Multi-League Proposal Evaluator (PROPOSE_ONLY, Read-Only)
        env:
          NODE_ENV: production
          CI: 'true'
          ALLOW_PRODUCTION_DB_WRITE: 'false'
          ALLOW_MANUAL_LEAGUE_PROMOTION: 'false'
          ENABLE_THESPORTSDB: 'false'
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const ts = require("typescript");
            require.extensions[".ts"] = (m, f) => {
              const out = ts.transpileModule(fs.readFileSync(f, "utf8"), {
                compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022, esModuleInterop: true, resolveJsonModule: true }
              });
              m._compile(out.outputText, f);
            };
            const { MultiLeagueAutoActivator } = require("./src/engine/activation/multiLeagueAutoActivator.ts");
            MultiLeagueAutoActivator.runAutoUnlockCycle({
              mode: "LIVE",
              forceAccountSync: true,
              explicitHumanApproval: false,
              persistToDatabase: false,
              allowProductionWrite: false,
              writeVerificationArtifact: false
            }).then(res => {
              console.log(JSON.stringify({
                promotionMode: res.promotionMode,
                productionWriteAllowed: res.productionWriteAllowed,
                quotaState: res.quotaDetection.state,
                requestCount: res.quotaDetection.requestCount,
                requestLimit: res.quotaDetection.requestLimit,
                billableRequestsMade: res.billableRequestsMade,
                leaguesPromoted: res.leaguesPromoted,
                leaguesProposedForReview: res.leaguesProposedForReview,
                activeLeaguesAfterRun: res.activeLeaguesAfterRun
              }, null, 2));
            }).catch(err => {
              console.error("[FATAL] Proposal evaluation failed:", err);
              process.exit(1);
            });
          '
